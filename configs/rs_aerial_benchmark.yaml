defaults:
  - machine: autodl_vigor
  - model: default
  - dataset: benchmark_vigor_chicago_rs_aerial
  - _self_

output_dir: ${hydra:run.dir}
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}
root_experiments_dir: ${machine.root_experiments_dir}
root_uniception_pretrained_checkpoints_dir: ${machine.root_uniception_pretrained_checkpoints_dir}

seed: 0
disable_cudnn_benchmark: true
batch_size: 1
amp: 1
amp_dtype: "bf16"

# Model input compatibility with scripts/export_pointcloud_ply.py.
# Existing Hydra usage with `model=...` remains supported. `model_input` can be
# used as an explicit alias when a caller wants to keep the model config group
# untouched and still select the export-style model name.
model_input: null
checkpoint_path: null
config_path: "configs/train.yaml"
config_json_path: null
model_str: null
config_overrides: null
hf_model_name: null
enable_clash_proxy: false
strict: false
vggt_joint_remote_export: false
vggt_export_mode: null
vggt_ordinary_output_head: null
vggt_remote_output_head: null
vggt_use_remote_private_point_head: false
