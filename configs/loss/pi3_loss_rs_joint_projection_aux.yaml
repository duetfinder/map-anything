remote_pointmap_loss_weight: 0.1
remote_raw_pointmap_loss_weight: 0.0
remote_height_loss_weight: 0.0
remote_projection_rel_height_loss_weight: 0.35
remote_projection_offset_loss_weight: 0.75
remote_projection_global_dir_loss_weight: 0.0
remote_projection_global_slope_loss_weight: 0.05
remote_projection_consistency_loss_weight: 0.0
remote_projection_rel_height_scale: 1.0
remote_projection_rel_height_scale_mode: fixed
remote_projection_rel_height_scale_quantile: 0.9
remote_projection_rel_height_clip: 0.0
remote_projection_rel_height_affine_loss_weight: 0.0
remote_projection_rel_height_balanced_loss_weight: 0.0
remote_projection_rel_height_balanced_quantiles: [0.5, 0.8]
remote_projection_offset_scale: 1.0
remote_projection_moge_gradient_loss_weight: 0.0
remote_projection_moge_edge_loss_weight: 0.0
remote_projection_moge_height_loss_weight: 0.0
remote_projection_moge_height_prior_min_weight: 0.02
remote_projection_moge_height_ground_quantile: 0.2
remote_projection_moge_height_exclude_hard_mask: true
remote_projection_moge_prior_min_weight: 0.02
remote_projection_moge_edge_temperature: 10.0
remote_projection_moge_edge_threshold: 0.5
test_remote_pointmap_loss_weight: ${loss.remote_pointmap_loss_weight}
test_remote_height_loss_weight: 0.0
remote_compare_in_view0_frame: true
remote_detach_pose_for_view0_align: false
remote_pointmap_norm_mode: avg_dis
scale_remote_loss_by_num_aerial_views: false

train_criterion: >
  JointAerialRSLoss(
    aerial_criterion=ExcludeTopNPercentPixelLoss(
      FactoredGeometryRegr3DPlusNormalGMLoss(
        RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
        norm_mode='avg_dis',
        depth_type_for_loss='depth_z',
        loss_in_log=True,
        flatten_across_image_only=True,
        compute_pairwise_relative_pose_loss=True,
        convert_predictions_to_view0_frame=True,
        compute_world_frame_points_loss=True,
        apply_normal_and_gm_loss_to_synthetic_data_only=True,
        normal_loss_weight=3.0,
        gm_loss_weight=3.0
      ),
      top_n_percent=5,
      apply_to_real_data_only=True,
      loss_set_indices=[0, 1, 2]
    ),
    remote_criterion=RSPointmapHeightProjectionAuxLoss(
      pointmap_criterion=L1Loss(reduction='none'),
      height_criterion=L1Loss(reduction='none'),
      pointmap_loss_weight=${loss.remote_pointmap_loss_weight},
      raw_pointmap_loss_weight=${loss.remote_raw_pointmap_loss_weight},
      height_loss_weight=${loss.remote_height_loss_weight},
      compare_in_view0_frame=${loss.remote_compare_in_view0_frame},
      detach_pose_for_view0_align=${loss.remote_detach_pose_for_view0_align},
      pointmap_norm_mode='${loss.remote_pointmap_norm_mode}',
      projection_rel_height_loss_weight=${loss.remote_projection_rel_height_loss_weight},
      projection_offset_loss_weight=${loss.remote_projection_offset_loss_weight},
      projection_global_dir_loss_weight=${loss.remote_projection_global_dir_loss_weight},
      projection_global_slope_loss_weight=${loss.remote_projection_global_slope_loss_weight},
      projection_consistency_loss_weight=${loss.remote_projection_consistency_loss_weight},
      projection_rel_height_scale=${loss.remote_projection_rel_height_scale},
      projection_rel_height_scale_mode='${loss.remote_projection_rel_height_scale_mode}',
      projection_rel_height_scale_quantile=${loss.remote_projection_rel_height_scale_quantile},
      projection_rel_height_clip=${loss.remote_projection_rel_height_clip},
      projection_rel_height_affine_loss_weight=${loss.remote_projection_rel_height_affine_loss_weight},
      projection_rel_height_balanced_loss_weight=${loss.remote_projection_rel_height_balanced_loss_weight},
      projection_rel_height_balanced_quantiles=${loss.remote_projection_rel_height_balanced_quantiles},
      projection_offset_scale=${loss.remote_projection_offset_scale},
      projection_moge_gradient_loss_weight=${loss.remote_projection_moge_gradient_loss_weight},
      projection_moge_edge_loss_weight=${loss.remote_projection_moge_edge_loss_weight},
      projection_moge_height_loss_weight=${loss.remote_projection_moge_height_loss_weight},
      projection_moge_height_prior_min_weight=${loss.remote_projection_moge_height_prior_min_weight},
      projection_moge_height_ground_quantile=${loss.remote_projection_moge_height_ground_quantile},
      projection_moge_height_exclude_hard_mask=${loss.remote_projection_moge_height_exclude_hard_mask},
      projection_moge_prior_min_weight=${loss.remote_projection_moge_prior_min_weight},
      projection_moge_edge_temperature=${loss.remote_projection_moge_edge_temperature},
      projection_moge_edge_threshold=${loss.remote_projection_moge_edge_threshold}
    ),
    scale_remote_loss_by_num_aerial_views=${loss.scale_remote_loss_by_num_aerial_views}
  )

