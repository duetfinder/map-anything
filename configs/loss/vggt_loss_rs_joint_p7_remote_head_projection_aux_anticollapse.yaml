remote_pointmap_loss_weight: 4.0
remote_height_loss_weight: 0.0
remote_projection_rel_height_loss_weight: 0.5
remote_projection_offset_loss_weight: 2.0
remote_projection_offset_mag_loss_weight: 0.0
remote_projection_offset_dir_loss_weight: 0.0
remote_projection_global_dir_loss_weight: 0.1
remote_projection_global_slope_loss_weight: 0.5
remote_projection_consistency_loss_weight: 0.0
remote_projection_global_dir_from_offset: false
remote_projection_rel_height_scale: 1.0
remote_projection_rel_height_scale_mode: fixed
remote_projection_rel_height_clip: 0.0
remote_projection_rel_height_min: 0.0
remote_projection_rel_height_use_tilt_mask: false
remote_projection_offset_scale: 1.0
remote_projection_consistency_use_loss_space: false
remote_projection_offset_use_tilt_mask: true
remote_projection_consistency_use_tilt_mask: true
remote_projection_offset_min_magnitude: 0.5
remote_projection_consistency_min_magnitude: 0.5
remote_projection_rel_height_target_weight: 0.0
remote_projection_rel_height_target_weight_gamma: 1.0
remote_projection_rel_height_affine_loss_weight: 0.0
remote_projection_rel_height_affine_detach_fit: true
remote_projection_rel_height_affine_min_pixels: 16
remote_projection_offset_target_weight: 0.0
remote_projection_offset_target_weight_gamma: 1.0
test_remote_pointmap_loss_weight: ${loss.remote_pointmap_loss_weight}
test_remote_height_loss_weight: 0.0
remote_compare_in_view0_frame: false
remote_compare_gt_in_view0_frame_only: true
remote_detach_pose_for_view0_align: false
remote_pointmap_norm_mode: aerial_avg_dis
scale_remote_loss_by_num_aerial_views: true

train_criterion: >
  JointAerialRSLoss(
    aerial_criterion=ConfAndExcludeTopNPercentPixelLoss(
      FactoredGeometryRegr3DPlusNormalGMLoss(
        RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
        norm_mode='avg_dis',
        depth_type_for_loss='depth_z',
        loss_in_log=True,
        flatten_across_image_only=True,
        compute_pairwise_relative_pose_loss=False,
        compute_world_frame_points_loss=True,
        apply_normal_and_gm_loss_to_synthetic_data_only=True,
        normal_loss_weight=3.0,
        gm_loss_weight=3.0
      ),
      conf_alpha=0.2,
      top_n_percent=5,
      apply_to_real_data_only=True,
      conf_loss_set_indices=[0],
      exclude_loss_set_indices=[1, 2]
    ),
    remote_criterion=RSPointmapHeightProjectionAuxLoss(
      pointmap_criterion=L1Loss(reduction='none'),
      height_criterion=L1Loss(reduction='none'),
      pointmap_loss_weight=${loss.remote_pointmap_loss_weight},
      height_loss_weight=${loss.remote_height_loss_weight},
      compare_in_view0_frame=${loss.remote_compare_in_view0_frame},
      compare_gt_in_view0_frame_only=${loss.remote_compare_gt_in_view0_frame_only},
      detach_pose_for_view0_align=${loss.remote_detach_pose_for_view0_align},
      pointmap_norm_mode='${loss.remote_pointmap_norm_mode}',
      projection_rel_height_loss_weight=${loss.remote_projection_rel_height_loss_weight},
      projection_offset_loss_weight=${loss.remote_projection_offset_loss_weight},
      projection_offset_mag_loss_weight=${loss.remote_projection_offset_mag_loss_weight},
      projection_offset_dir_loss_weight=${loss.remote_projection_offset_dir_loss_weight},
      projection_global_dir_loss_weight=${loss.remote_projection_global_dir_loss_weight},
      projection_global_slope_loss_weight=${loss.remote_projection_global_slope_loss_weight},
      projection_consistency_loss_weight=${loss.remote_projection_consistency_loss_weight},
      projection_global_dir_from_offset=${loss.remote_projection_global_dir_from_offset},
      projection_rel_height_scale=${loss.remote_projection_rel_height_scale},
      projection_rel_height_scale_mode='${loss.remote_projection_rel_height_scale_mode}',
      projection_rel_height_clip=${loss.remote_projection_rel_height_clip},
      projection_rel_height_min=${loss.remote_projection_rel_height_min},
      projection_rel_height_use_tilt_mask=${loss.remote_projection_rel_height_use_tilt_mask},
      projection_offset_scale=${loss.remote_projection_offset_scale},
      projection_consistency_use_loss_space=${loss.remote_projection_consistency_use_loss_space},
      projection_offset_use_tilt_mask=${loss.remote_projection_offset_use_tilt_mask},
      projection_consistency_use_tilt_mask=${loss.remote_projection_consistency_use_tilt_mask},
      projection_offset_min_magnitude=${loss.remote_projection_offset_min_magnitude},
      projection_consistency_min_magnitude=${loss.remote_projection_consistency_min_magnitude},
      projection_rel_height_target_weight=${loss.remote_projection_rel_height_target_weight},
      projection_rel_height_target_weight_gamma=${loss.remote_projection_rel_height_target_weight_gamma},
      projection_rel_height_affine_loss_weight=${loss.remote_projection_rel_height_affine_loss_weight},
      projection_rel_height_affine_detach_fit=${loss.remote_projection_rel_height_affine_detach_fit},
      projection_rel_height_affine_min_pixels=${loss.remote_projection_rel_height_affine_min_pixels},
      projection_offset_target_weight=${loss.remote_projection_offset_target_weight},
      projection_offset_target_weight_gamma=${loss.remote_projection_offset_target_weight_gamma}
    ),
    scale_remote_loss_by_num_aerial_views=${loss.scale_remote_loss_by_num_aerial_views}
  )

test_criterion: >
  JointAerialRSLoss(
    aerial_criterion=ExcludeTopNPercentPixelLoss(
      FactoredGeometryRegr3DPlusNormalGMLoss(
        RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
        norm_mode='avg_dis',
        depth_type_for_loss='depth_z',
        loss_in_log=True,
        flatten_across_image_only=True,
        compute_pairwise_relative_pose_loss=False,
        compute_world_frame_points_loss=True,
        apply_normal_and_gm_loss_to_synthetic_data_only=True,
        normal_loss_weight=3.0,
        gm_loss_weight=3.0
      ),
      top_n_percent=5,
      apply_to_real_data_only=True,
      loss_set_indices=[0, 1, 2]
    ),
    remote_criterion=RSPointmapHeightProjectionAuxLoss(
      pointmap_criterion=L1Loss(reduction='none'),
      height_criterion=L1Loss(reduction='none'),
      pointmap_loss_weight=${loss.test_remote_pointmap_loss_weight},
      height_loss_weight=${loss.test_remote_height_loss_weight},
      compare_in_view0_frame=${loss.remote_compare_in_view0_frame},
      compare_gt_in_view0_frame_only=${loss.remote_compare_gt_in_view0_frame_only},
      detach_pose_for_view0_align=${loss.remote_detach_pose_for_view0_align},
      pointmap_norm_mode='${loss.remote_pointmap_norm_mode}',
      projection_rel_height_loss_weight=${loss.remote_projection_rel_height_loss_weight},
      projection_offset_loss_weight=${loss.remote_projection_offset_loss_weight},
      projection_offset_mag_loss_weight=${loss.remote_projection_offset_mag_loss_weight},
      projection_offset_dir_loss_weight=${loss.remote_projection_offset_dir_loss_weight},
      projection_global_dir_loss_weight=${loss.remote_projection_global_dir_loss_weight},
      projection_global_slope_loss_weight=${loss.remote_projection_global_slope_loss_weight},
      projection_consistency_loss_weight=${loss.remote_projection_consistency_loss_weight},
      projection_global_dir_from_offset=${loss.remote_projection_global_dir_from_offset},
      projection_rel_height_scale=${loss.remote_projection_rel_height_scale},
      projection_rel_height_scale_mode='${loss.remote_projection_rel_height_scale_mode}',
      projection_rel_height_clip=${loss.remote_projection_rel_height_clip},
      projection_rel_height_min=${loss.remote_projection_rel_height_min},
      projection_rel_height_use_tilt_mask=${loss.remote_projection_rel_height_use_tilt_mask},
      projection_offset_scale=${loss.remote_projection_offset_scale},
      projection_consistency_use_loss_space=${loss.remote_projection_consistency_use_loss_space},
      projection_offset_use_tilt_mask=${loss.remote_projection_offset_use_tilt_mask},
      projection_consistency_use_tilt_mask=${loss.remote_projection_consistency_use_tilt_mask},
      projection_offset_min_magnitude=${loss.remote_projection_offset_min_magnitude},
      projection_consistency_min_magnitude=${loss.remote_projection_consistency_min_magnitude},
      projection_rel_height_target_weight=${loss.remote_projection_rel_height_target_weight},
      projection_rel_height_target_weight_gamma=${loss.remote_projection_rel_height_target_weight_gamma},
      projection_rel_height_affine_loss_weight=${loss.remote_projection_rel_height_affine_loss_weight},
      projection_rel_height_affine_detach_fit=${loss.remote_projection_rel_height_affine_detach_fit},
      projection_rel_height_affine_min_pixels=${loss.remote_projection_rel_height_affine_min_pixels},
      projection_offset_target_weight=${loss.remote_projection_offset_target_weight},
      projection_offset_target_weight_gamma=${loss.remote_projection_offset_target_weight_gamma}
    ),
    scale_remote_loss_by_num_aerial_views=${loss.scale_remote_loss_by_num_aerial_views}
  )
