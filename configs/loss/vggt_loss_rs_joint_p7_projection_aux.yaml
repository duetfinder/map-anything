remote_pointmap_loss_weight: 4.0
remote_height_loss_weight: 0.0
remote_projection_rel_height_loss_weight: 0.2
remote_projection_offset_loss_weight: 0.5
remote_projection_global_dir_loss_weight: 0.05
remote_projection_global_slope_loss_weight: 0.05
remote_projection_consistency_loss_weight: 0.2
remote_projection_offset_use_tilt_mask: false
remote_projection_consistency_use_tilt_mask: false
test_remote_pointmap_loss_weight: ${loss.remote_pointmap_loss_weight}
test_remote_height_loss_weight: 0.0
remote_compare_in_view0_frame: false
remote_compare_gt_in_view0_frame_only: true
remote_detach_pose_for_view0_align: false
# Use the same avg_dis scale source as aerial views. This matches the
# p5b shared-normalization setting that avoids remote-only scale drift.
remote_pointmap_norm_mode: aerial_avg_dis
scale_remote_loss_by_num_aerial_views: true
branch_consistency_loss_weight: 0.2
branch_consistency_norm_mode: null
branch_consistency_detach_depth_target: true

train_criterion: >
  JointAerialRSLoss(
    aerial_criterion=ConfAndExcludeTopNPercentPixelLoss(
      FactoredGeometryRegr3DPlusNormalGMLoss(
        RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
        norm_mode='avg_dis',
        depth_type_for_loss='depth_z',
        loss_in_log=True,
        flatten_across_image_only=True,
        compute_pairwise_relative_pose_loss=False,
        compute_world_frame_points_loss=True,
        apply_normal_and_gm_loss_to_synthetic_data_only=True,
        normal_loss_weight=3.0,
        gm_loss_weight=3.0
      ),
      conf_alpha=0.2,
      top_n_percent=5,
      apply_to_real_data_only=True,
      conf_loss_set_indices=[0],
      exclude_loss_set_indices=[1, 2]
    ),
    remote_criterion=RSPointmapHeightProjectionAuxLoss(
      pointmap_criterion=L1Loss(reduction='none'),
      height_criterion=L1Loss(reduction='none'),
      pointmap_loss_weight=${loss.remote_pointmap_loss_weight},
      height_loss_weight=${loss.remote_height_loss_weight},
      compare_in_view0_frame=${loss.remote_compare_in_view0_frame},
      compare_gt_in_view0_frame_only=${loss.remote_compare_gt_in_view0_frame_only},
      detach_pose_for_view0_align=${loss.remote_detach_pose_for_view0_align},
      pointmap_norm_mode='${loss.remote_pointmap_norm_mode}',
      projection_rel_height_loss_weight=${loss.remote_projection_rel_height_loss_weight},
      projection_offset_loss_weight=${loss.remote_projection_offset_loss_weight},
      projection_global_dir_loss_weight=${loss.remote_projection_global_dir_loss_weight},
      projection_global_slope_loss_weight=${loss.remote_projection_global_slope_loss_weight},
      projection_consistency_loss_weight=${loss.remote_projection_consistency_loss_weight},
      projection_offset_use_tilt_mask=${loss.remote_projection_offset_use_tilt_mask},
      projection_consistency_use_tilt_mask=${loss.remote_projection_consistency_use_tilt_mask}
    ),
    branch_consistency_criterion=VGGTBranchConsistencyLoss(
      criterion=L1Loss(reduction='none'),
      pointmap_norm_mode='${loss.branch_consistency_norm_mode}',
      detach_depth_target=${loss.branch_consistency_detach_depth_target}
    ),
    branch_consistency_loss_weight=${loss.branch_consistency_loss_weight},
    scale_remote_loss_by_num_aerial_views=${loss.scale_remote_loss_by_num_aerial_views}
  )
test_criterion: >
  JointAerialRSLoss(
    aerial_criterion=ExcludeTopNPercentPixelLoss(
      FactoredGeometryRegr3DPlusNormalGMLoss(
        RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
        norm_mode='avg_dis',
        depth_type_for_loss='depth_z',
        loss_in_log=True,
        flatten_across_image_only=True,
        compute_pairwise_relative_pose_loss=False,
        compute_world_frame_points_loss=True,
        apply_normal_and_gm_loss_to_synthetic_data_only=True,
        normal_loss_weight=3.0,
        gm_loss_weight=3.0
      ),
      top_n_percent=5,
      apply_to_real_data_only=True,
      loss_set_indices=[0, 1, 2]
    ),
    remote_criterion=RSPointmapHeightProjectionAuxLoss(
      pointmap_criterion=L1Loss(reduction='none'),
      height_criterion=L1Loss(reduction='none'),
      pointmap_loss_weight=${loss.test_remote_pointmap_loss_weight},
      height_loss_weight=${loss.test_remote_height_loss_weight},
      compare_in_view0_frame=${loss.remote_compare_in_view0_frame},
      compare_gt_in_view0_frame_only=${loss.remote_compare_gt_in_view0_frame_only},
      detach_pose_for_view0_align=${loss.remote_detach_pose_for_view0_align},
      pointmap_norm_mode='${loss.remote_pointmap_norm_mode}',
      projection_rel_height_loss_weight=${loss.remote_projection_rel_height_loss_weight},
      projection_offset_loss_weight=${loss.remote_projection_offset_loss_weight},
      projection_global_dir_loss_weight=${loss.remote_projection_global_dir_loss_weight},
      projection_global_slope_loss_weight=${loss.remote_projection_global_slope_loss_weight},
      projection_consistency_loss_weight=${loss.remote_projection_consistency_loss_weight},
      projection_offset_use_tilt_mask=${loss.remote_projection_offset_use_tilt_mask},
      projection_consistency_use_tilt_mask=${loss.remote_projection_consistency_use_tilt_mask}
    ),
    branch_consistency_criterion=VGGTBranchConsistencyLoss(
      criterion=L1Loss(reduction='none'),
      pointmap_norm_mode='${loss.branch_consistency_norm_mode}',
      detach_depth_target=${loss.branch_consistency_detach_depth_target}
    ),
    branch_consistency_loss_weight=0.0,
    scale_remote_loss_by_num_aerial_views=${loss.scale_remote_loss_by_num_aerial_views}
  )
