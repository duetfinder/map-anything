defaults:
  - vggt_p7_p5b_shared_norm_projection_aux_parallel_token_lowtrunklr

# P7 structural test:
# - keep the parallel token aux head;
# - add a small gated residual on remote patch tokens before the remote point head;
# - gate starts at zero, so warm-start behavior is initially preserved.

submodule_configs:
  remote_projection_aux_token_residual_gate:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_residual:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
