defaults:
  - vggt_p7_p5b_private_oldp7_p5bhead_frozen_trunk_train_remotehead_aux

# Low-LR aggregator probe:
# - keep ordinary heads frozen;
# - train private remote_point_head and parallel token projection aux;
# - allow the shared VGGT aggregator to move very slightly so remote tokens can
#   adapt without a broad trunk finetune.

submodule_configs:
  model.aggregator:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.patch_embed:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
