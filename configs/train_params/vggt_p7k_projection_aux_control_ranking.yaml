defaults:
  - vggt_p7_projection_aux

# P7K keeps the P7I/P7J conservative fusion setup and adds remote-control
# ranking loss so matched remote is explicitly trained to beat blank/shuffled
# controls on ordinary-view aerial reconstruction. keep the VGGT trunk frozen, keep
# projection_aux/remote private point learning, but make late fusion weak.
# This tests whether remote projection supervision can help without the branch
# consistency term or an aggressive gate perturbing ordinary-view geometry.
submodule_configs:
  remote_to_aerial_late_gate:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_film:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_query_norm:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_key_value_norm:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_cross_attention:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_pixel_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_image_stem:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_global_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}


# Remote-control ranking aligns training with the mini-controls benchmark.
remote_control_ranking_loss_weight: 0.1
remote_control_ranking_margin: 0.0
remote_control_ranking_modes: [blank, shuffled]
remote_control_blank_value: 0.5
remote_blank_preserve_loss_weight: 0.0
