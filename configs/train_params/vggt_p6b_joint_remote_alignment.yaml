defaults:
  - vggt_finetune

# P6B: joint-frame remote point alignment. Keep VGGT in a shared forward
# frame and explicitly train remote-view point output against
# remote_pointmap_view0. This intentionally avoids P6A split/protected heads.
lr: 5e-06
min_lr: 5e-08

submodule_configs:
  # Keep the image patch embedding nearly anchored.
  model.aggregator.patch_embed:
    lr: 5e-07
    min_lr: 5e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  # Let the joint attention trunk adapt cautiously so ordinary and remote tokens
  # can share a frame without destroying the official VGGT prior.
  model.aggregator.frame_blocks:
    lr: 2e-06
    min_lr: 2e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks:
    lr: 2e-06
    min_lr: 2e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  # Ordinary camera/depth heads remain fixed anchors.
  model.camera_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  model.track_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  # Shared point head is only trained in P6B shared-head runs. Private-head runs
  # override this to 0 from the shell script.
  model.point_head:
    lr: 5e-06
    min_lr: 5e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  # Remote private head is only present in private-head runs. Shared-head runs
  # override this to 0 from the shell script.
  remote_point_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  aerial_view_type_embedding:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_view_type_embedding:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
