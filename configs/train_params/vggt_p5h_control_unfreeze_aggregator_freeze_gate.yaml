defaults:
  - vggt_p5h_control_unfreeze_aggregator

# Same capacity as vggt_p5h_control_unfreeze_aggregator, but keep the
# late fusion gate fixed at initialization so the model cannot satisfy the
# ordinary reconstruction loss by immediately closing the remote path.
submodule_configs:
  remote_to_aerial_late_gate:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
