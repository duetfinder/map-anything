defaults:
  - vggt_p7_p5b_private_oldp7_p5bhead_aggtail2_lowlr_train_remotehead_aux
  - _self_

# Same structure as aggtail2_lowlr, but allow the final two shared aggregator
# blocks to adapt more visibly under dense MoGe-assisted projection aux losses.

submodule_configs:
  model.aggregator.frame_blocks.22:
    lr: 5e-07
    min_lr: 5e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks.22:
    lr: 5e-07
    min_lr: 5e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.frame_blocks.23:
    lr: 5e-07
    min_lr: 5e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks.23:
    lr: 5e-07
    min_lr: 5e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
