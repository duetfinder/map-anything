defaults:
  - vggt_p7_p5b_parallel_token_aux_recover_p5b

# Hybrid recovery:
# - main trunk/aux warm-start from the best old P7-P5B lowtrunk checkpoint;
# - remote private point head is initialized from original P5B point_head;
# - keep trunk conservative and adapt the private remote head slightly faster.
lr: 1e-06
min_lr: 1e-08

submodule_configs:
  model.aggregator.patch_embed:
    lr: 5e-08
    min_lr: 5e-10
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 8e-06
    min_lr: 8e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_norm:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_proj:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_pixel_head:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_image_stem:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_global_head:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
