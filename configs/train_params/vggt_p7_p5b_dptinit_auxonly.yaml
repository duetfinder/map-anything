defaults:
  - vggt_p7_p5b_shared_norm_projection_aux

# Capacity probe for projection aux with pretrained dense decoders:
# - height aux head is initialized from VGGT depth_head;
# - offset aux head is initialized from VGGT point_head;
# - freeze the shared VGGT trunk and reconstruction heads;
# - train only the new DPT projection aux heads on chicago+newyork.
#
# Keep find_unused_parameters enabled because the global aux head can be unused
# when global-dir/slope losses are disabled.
lr: 0.0
min_lr: 0.0
ddp_static_graph: false
ddp_find_unused_parameters: true

submodule_configs:
  model.aggregator.patch_embed:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.track_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.camera_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_height_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_offset_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_dpt_global_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
