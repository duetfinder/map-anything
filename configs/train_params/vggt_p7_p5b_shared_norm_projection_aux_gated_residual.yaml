defaults:
  - vggt_p7_p5b_shared_norm_projection_aux

# Minimal structure-side probe for P7: keep the existing projection-aux and
# remote point-head schedule, but train the lightweight remote-to-aerial adapter
# fast enough to matter in a short run.
submodule_configs:
  pre_aggregator_view_type_embedding:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_gate:
    lr: 5e-04
    min_lr: 5e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_residual:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
