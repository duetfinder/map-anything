defaults:
  - vggt_p7_p5b_shared_norm_projection_aux

# Keep a tiny patch_embed LR so checkpointed remote_point_head receives grad-carrying
# features; freeze the rest of VGGT and all projection-aux heads so p7ad8 geometry
# acts as a regularizer for the remote point head.
submodule_configs:
  model:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: 0
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.patch_embed:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 2e-06
    min_lr: 2e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_pixel_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: 0
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_image_stem:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: 0
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_global_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: 0
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
