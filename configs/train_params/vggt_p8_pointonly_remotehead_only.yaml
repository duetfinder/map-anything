defaults:
  - vggt_finetune

# P8 diagnostic: keep the pretrained VGGT trunk fixed and train only the
# private remote point head. This tests whether the existing remote tokens
# already contain enough geometry for direct pointmap decoding.
lr: 0.0
min_lr: 0.0

submodule_configs:
  model.aggregator.patch_embed:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  model:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  remote_point_head:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  aerial_view_type_embedding:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_view_type_embedding:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
