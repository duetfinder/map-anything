defaults:
  - vggt_p7_p5b_private_p5bhead_oldp7_parallel_token_aux

# Hybrid repair stage:
# - warm-start from oldP7 trunk/aux with original P5B point_head copied into
#   remote_point_head;
# - freeze remote_point_head so the recovered P5B remote geometry is not pulled
#   back toward the depressed-height P7 solution;
# - allow only a very small trunk update and normal aux-head adaptation.
lr: 2e-07
min_lr: 2e-09

submodule_configs:
  model.aggregator.patch_embed:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_norm:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_proj:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_pixel_head:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_image_stem:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_global_head:
    lr: 6e-05
    min_lr: 6e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
