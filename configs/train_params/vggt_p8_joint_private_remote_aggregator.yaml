defaults:
  - vggt_finetune

# P8 joint recovery probe with true parameter isolation.
# Ordinary views keep the original VGGT aggregator/heads mostly fixed, while
# remote views use a separate aggregator initialized from a remote-only model.
lr: 0
min_lr: 0
warn_not_in_submodule: false

initialize_remote_aggregator_ckpt: null
initialize_remote_aggregator_source_prefix: "model.aggregator."
initialize_remote_private_point_head_ckpt: null
initialize_remote_private_point_head_source_prefix: "remote_point_head."

submodule_configs:
  model.aggregator:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.patch_embed:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.camera_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.track_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.point_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  remote_aggregator.patch_embed:
    lr: 1e-06
    min_lr: 1e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_aggregator.frame_blocks:
    lr: 8e-06
    min_lr: 8e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_aggregator.global_blocks:
    lr: 8e-06
    min_lr: 8e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

  remote_point_head:
    lr: 3e-05
    min_lr: 3e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
