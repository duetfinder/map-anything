defaults:
  - vggt_finetune

# P5f-lite keeps VGGT mostly anchored and trains the new remote-conditioning
# parameters more aggressively than the shared trunk.
lr: 5e-06
min_lr: 5e-08

submodule_configs:
  pre_aggregator_view_type_embedding:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_gate:
    lr: 5e-04
    min_lr: 5e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_residual:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 1e-05
    min_lr: 1e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.patch_embed:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.frame_blocks:
    lr: 1e-06
    min_lr: 1e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks:
    lr: 1e-06
    min_lr: 1e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.camera_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.point_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model.track_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
