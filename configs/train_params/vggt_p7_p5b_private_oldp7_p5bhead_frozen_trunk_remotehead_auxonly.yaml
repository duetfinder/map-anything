defaults:
  - vggt_p7_p5b_private_oldp7_p5bhead_freeze_remotehead_parallel_token_aux

# Aux-only probe:
# - warm-start from the repaired P7 checkpoint with the original P5B remote
#   point head copied in;
# - freeze the VGGT trunk and all geometry heads;
# - train only the parallel projection auxiliary head.
#
# This verifies whether the projection mechanism can be decoded from fixed
# P7/P5B tokens without further changing remote pointmap geometry.
lr: 0.0
min_lr: 0.0

submodule_configs:
  model.aggregator:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.track_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.camera_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_norm:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_proj:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_pixel_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_image_stem:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_token_global_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
