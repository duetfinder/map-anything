defaults:
  - vggt_finetune

# P7 remote-head projection-aux keeps the official VGGT trunk and ordinary
# camera/depth heads fixed. Only the remote point head and projection auxiliary
# heads are trained, so this isolates remote multitask learning from ordinary
# reconstruction drift.
lr: 0
min_lr: 0

submodule_configs:
  remote_point_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_pixel_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_global_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
