defaults:
  - vggt_p7_p5b_shared_norm_projection_aux

# DPT-init projection aux + remote point head with a tiny shared-token update.
# The tail block entries must appear before model.aggregator because parameter
# grouping uses first-prefix matching.
lr: 0.0
min_lr: 0.0
ddp_static_graph: false
ddp_find_unused_parameters: true
remote_point_head_param_anchor_loss_weight: 0.0

submodule_configs:
  model.aggregator.frame_blocks.22:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks.22:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.frame_blocks.23:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.global_blocks.23:
    lr: 1e-07
    min_lr: 1e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator.patch_embed:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.aggregator:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.track_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.camera_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.point_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  model.depth_head:
    lr: 0.0
    min_lr: 0.0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 3e-06
    min_lr: 3e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_height_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_offset_head:
    lr: 2e-05
    min_lr: 2e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_projection_aux_dpt_global_head:
    lr: 1e-04
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
