defaults:
  - default

# P5h starts from a finetuned wrapper checkpoint, freezes the base model and
# trains only the late remote-to-aerial adapter. This keeps ordinary VGGT/p5e
# behavior stable while testing whether correct remote context adds value.
lr: 0
min_lr: 0

submodule_configs:
  remote_to_aerial_late_gate:
    lr: 5e-04
    min_lr: 5e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_film:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_query_norm:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_key_value_norm:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_to_aerial_late_cross_attention:
    lr: 5e-05
    min_lr: 5e-07
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  aerial_view_type_embedding:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_view_type_embedding:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  model:
    lr: 0
    min_lr: 0
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
# Optional remote-control ranking objective. Disabled by default; experiment
# wrappers can enable it to force same remote to beat blank/shuffled controls.
remote_control_ranking_loss_weight: 0.0
remote_control_ranking_margin: 0.0
remote_control_ranking_modes: [blank, shuffled]
remote_control_blank_value: 0.5

