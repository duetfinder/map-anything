defaults:
  - vggt_p8_joint_private_remote_aggregator

# Low-LR continuation from an already working private-remote-aggregator
# checkpoint. This is intended to test whether joint training can improve
# without perturbing the learned remote point solution.
submodule_configs:
  remote_aggregator.patch_embed:
    lr: 2e-07
    min_lr: 2e-09
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_aggregator.frame_blocks:
    lr: 1e-06
    min_lr: 1e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_aggregator.global_blocks:
    lr: 1e-06
    min_lr: 1e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  remote_point_head:
    lr: 3e-06
    min_lr: 3e-08
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
