defaults:
  - default

lr: 5e-06
min_lr: 5e-08
warmup_epochs: 1

submodule_configs:
  encoder:
    lr: 0
  ray_dirs_encoder:
    lr: 0
  depth_encoder:
    lr: 0
  depth_scale_encoder:
    lr: 0
  cam_rot_encoder:
    lr: 0
  cam_trans_encoder:
    lr: 0
  cam_trans_scale_encoder:
    lr: 0
  fusion_norm_layer:
    lr: 0
  scale_token:
    lr: 0
  dpt_feature_head:
    lr: 0
  dpt_regressor_head:
    lr: 0
  pose_head:
    lr: 0
  scale_head:
    lr: 0
  remote_encoder:
    lr: ${train_params.lr}
  remote_dpt_feature_head:
    lr: ${train_params.lr}
  remote_dpt_regressor_head:
    lr: ${train_params.lr}
  aerial_view_type_embedding:
    lr: ${train_params.lr}
  remote_view_type_embedding:
    lr: ${train_params.lr}
  info_sharing:
    lr: ${train_params.lr}
