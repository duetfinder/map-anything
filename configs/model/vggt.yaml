# String for model factory
model_str: "vggt"
# Model config
model_config:
  name: "vggt"
  # Load pre-trained weights
  load_pretrained_weights: true
  # Load custom checkpoint
  load_custom_ckpt: false
  # Custom checkpoint path
  custom_ckpt_path: null
  # For RS-joint experiments, route only remote views through VGGT's native point head.
  use_point_head_for_remote: false
  # Lightweight domain signal used by p5c.
  use_view_type_bias: false
  # Instance tag used by the joint RS training path for the appended remote view.
  remote_instance_value: "remote"
# Image Normalization Type
data_norm_type: "identity"
# VGGT checkpoint is already loaded in the inference wrapper
pretrained: null
# Torch hub force reload
torch_hub_force_reload: false
