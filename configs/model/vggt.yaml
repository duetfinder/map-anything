# String for model factory
model_str: "vggt"
# Model config
model_config:
  name: "vggt"
  # Load pre-trained weights
  load_pretrained_weights: true
  # Load custom checkpoint
  load_custom_ckpt: false
  # Custom checkpoint path
  custom_ckpt_path: null
  # For RS-joint experiments, route only remote views through VGGT's native point head.
  use_point_head_for_remote: false
  # Lightweight domain signal used by p5c.
  use_view_type_bias: false
  # Instance tag used by the joint RS training path for the appended remote view.
  remote_instance_value: "remote"
  # Export/debug controls. "depth" uses camera+depth; "point" uses VGGT point_head.
  ordinary_output_head: "depth"
  # "auto" preserves training behavior: point only when use_point_head_for_remote=true.
  remote_output_head: "auto"
  # P5d: use a dedicated remote point_head initialized from VGGT's native point_head.
  use_remote_private_point_head: false
  # P5d diagnostics/training: expose native point_head outputs for ordinary views.
  output_point_head_for_consistency: false
  # P5f-lite: inject view-type signal before VGGT's aggregator patch tokens.
  use_pre_aggregator_view_type_bias: false
  # P5f-lite: add a tiny gated remote-context residual to ordinary patch tokens.
  use_remote_to_aerial_gated_residual: false
  remote_to_aerial_residual_hidden_scale: 0.25
  remote_to_aerial_gate_init: 0.0
# Image Normalization Type
data_norm_type: "identity"
# VGGT checkpoint is already loaded in the inference wrapper
pretrained: null
# Torch hub force reload
torch_hub_force_reload: false
